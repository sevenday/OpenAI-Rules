name: Check AI network rules

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Fetch OpenAI allowlist and regenerate rules
        id: update_openai
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python scripts/update.py

      - name: Fetch Claude network requirements and regenerate rules
        id: update_claude
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python scripts/update_claude.py

      - name: Create or update pull request
        if: github.event_name != 'pull_request' && (steps.update_openai.outcome == 'success' || steps.update_claude.outcome == 'success')
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/ai-network-rules
          delete-branch: true
          commit-message: "chore: update AI network rules"
          title: "chore: update AI network rules"
          body: |
            Official OpenAI and/or Anthropic network documentation produced a rule-source change.

            Sources checked automatically:
            - https://help.openai.com/en/articles/9247338
            - https://code.claude.com/docs/en/corporate-proxy
            - https://code.claude.com/docs/en/desktop

            Please review additions/removals before merging. The workflow never auto-merges this PR.
          add-paths: |
            data/official.txt
            data/claude/official.txt
            rules/OpenAI.list
            rules/OpenAI.yaml
            rules/OpenAI-Surge.list
            rules/Claude.list
            rules/Claude.yaml
            rules/Claude-Surge.list

      - name: Report official-source update failures
        if: always() && github.event_name != 'pull_request' && (steps.update_openai.outcome == 'failure' || steps.update_claude.outcome == 'failure')
        run: |
          echo "::error::One or more official-source update steps failed. See their logs; successful source changes may still have been submitted as a pull request."
          exit 1
